# ============================================================
# HANA MCP — Server Configuration
# ============================================================

hana:
  address: localhost
  port: 39041
  user: SYSTEM
  password: HXEHana1

  # user: MCP_MONITOR
  # password: HXEHana2


# ============================================================
# SECURITY
# ============================================================
security:
  readonly: true

  # Maximum rows any query may return (SELECT * is auto-limited to this).
  max_rows: 100

  # Server-side statement timeout in seconds (optional).
  timeout_seconds: 30

  allowed_statements:
    - SELECT
    - WITH

  blocked_keywords:
    - INSERT
    - UPDATE
    - DELETE
    - DROP
    - ALTER
    - CREATE
    - TRUNCATE
    - MERGE
    - CALL
    - GRANT
    - REVOKE

  # Optional allow-lists for object access (empty = allow all).
  allowed_schemas: []
  allowed_views: []


# ============================================================
# MONITORING TOOLS
#
# Each tool becomes a dynamic MCP tool named `hana_<name>`.
# Keys: description, category, icon, severity, query
# ============================================================
monitoring:

  system_status:
    description: "Overall SAP HANA database status and version"
    category: "Resources"
    icon: "database"
    severity: "info"
    query: |
      SELECT
        DATABASE_NAME,
        VERSION,
        CURRENT_USER
      FROM SYS.M_DATABASE

  services:
    description: "Active HANA services and their ports. Optional: filter by SERVICE_NAME (e.g. 'indexserver' or 'indexserver,daemon' for multiple)"
    category: "Resources"
    icon: "services"
    severity: "info"
    inputs:
      - name: "service_name"
        type: "str"
        description: "Filter by service name(s) (e.g. 'indexserver' or 'indexserver,daemon' for multiple). Empty = all services."
        default: ""
    query: |
      SELECT
        SERVICE_NAME,
        HOST,
        PORT,
        ACTIVE_STATUS,
        SQL_PORT,
        COORDINATOR_TYPE
      FROM SYS.M_SERVICES
      ORDER BY SERVICE_NAME, PORT

  memory:
    description: "Semantic HANA memory metrics with pressure evaluation"
    category: "Resources"
    icon: "memory"
    severity: "info"
    query: |
      SELECT
        NAME,
        VALUE
      FROM SYS.M_MEMORY

  cpu:
    description: "HANA CPU utilization per host"
    category: "Resources"
    icon: "cpu"
    severity: "info"
    query: |
      SELECT
        HOST,
        TOTAL_CPU_USER_TIME,
        TOTAL_CPU_SYSTEM_TIME,
        TOTAL_CPU_IDLE_TIME
      FROM SYS.M_HOST_RESOURCE_UTILIZATION

  disk:
    description: "HANA disk and volume usage"
    category: "Resources"
    icon: "disk"
    severity: "info"
    query: |
      SELECT *
      FROM SYS.M_DISK_USAGE

  connections:
    description: "Active database connection count only. Does NOT return user names or session details. Use hana_execute_query(SELECT USER_NAME FROM SYS.USERS) for user lists."
    category: "Resources"
    icon: "connections"
    severity: "info"
    query: |
      SELECT
        COUNT(*) AS CONNECTIONS
      FROM SYS.M_CONNECTIONS
      WHERE CONNECTION_ID > 0
        AND CONNECTION_STATUS IN ('RUNNING', 'IDLE', 'QUEUING')

  replication:
    description: "System replication status"
    category: "High Availability"
    icon: "replication"
    severity: "warning"
    query: |
      SELECT *
      FROM SYS.M_SERVICE_REPLICATION

  backup_status:
    description: "Recent backup catalog entries and backup history"
    category: "Operations"
    icon: "backup"
    severity: "info"
    query: |
      SELECT
        TOP 20
        *
      FROM SYS.M_BACKUP_CATALOG
      ORDER BY SYS_START_TIME DESC

  expensive_statements:
    description: "Top expensive SQL statements by duration"
    category: "Performance"
    icon: "expensive"
    severity: "warning"
    query: |
      SELECT
        TOP 20
        START_TIME,
        DB_USER,
        DURATION_MICROSEC,
        STATEMENT_STRING
      FROM SYS.M_EXPENSIVE_STATEMENTS
      ORDER BY START_TIME DESC

  active_statements:
    description: "Currently active SQL statements"
    category: "Performance"
    icon: "active"
    severity: "info"
    query: |
      SELECT
        CONNECTION_ID,
        STATEMENT_STATUS,
        LAST_EXECUTED_TIME,
        EXECUTION_COUNT,
        STATEMENT_STRING
      FROM SYS.M_ACTIVE_STATEMENTS
      WHERE STATEMENT_STATUS = 'ACTIVE'

  blocked_transactions:
    description: "Blocked transactions / lock waits"
    category: "Performance"
    icon: "lock"
    severity: "critical"
    query: |
      SELECT *
      FROM SYS.M_BLOCKED_TRANSACTIONS

  table_sizes:
    description: "Largest HANA tables by memory"
    category: "Storage"
    icon: "table"
    severity: "info"
    query: |
      SELECT
        SCHEMA_NAME,
        TABLE_NAME,
        RECORD_COUNT,
        MEMORY_SIZE_IN_TOTAL
      FROM SYS.M_CS_TABLES
      ORDER BY MEMORY_SIZE_IN_TOTAL DESC

  trace_files:
    description: "HANA trace files overview"
    category: "Diagnostics"
    icon: "trace"
    severity: "info"
    query: |
      SELECT
        HOST,
        FILE_NAME,
        FILE_SIZE,
        USED_SIZE,
        FILE_MTIME
      FROM SYS.M_TRACEFILES
      ORDER BY FILE_MTIME DESC


# ============================================================
# LLM AGENT (optional, OFF by default)
#
# When `enabled: false` (default) the Web UI AI Chat keeps using the
# existing keyword router and never contacts a model.
#
# Enable only to give the Web UI real tool-calling reasoning. Point
# `base_url` at any OpenAI-compatible Chat Completions endpoint. The
# zero-cost option is a local model such as Ollama:
#     base_url: http://localhost:11434/v1   (no API key needed)
# `api_key` may be a dummy value for local endpoints.
#
# IMPORTANT: For reliable tool-calling and reasoning, use a model with
# at least 7B parameters. The 3B model is too small for this task.
# Recommended free local models:
#   - qwen2.5:7b
#   - llama3.1:8b
#   - mistral:7b
#   - gemma2:9b
#
# Safety net: if the agent is enabled but the model is unreachable,
# the Web UI automatically falls back to the keyword router, so it
# keeps answering instead of erroring.
# ============================================================
llm:
  enabled: true
  provider: openai
  base_url: http://172.17.64.1:11434/v1
  model: llama3.1:8b
  temperature: 0.1   
  top_p: 0.8         
  max_tokens: 1000
  max_tool_rounds: 5
  request_timeout: 180